services:
  itemq:
    image: localhost/itemq:latest
    container_name: itemq
    ports:
      - "8080:8080"
    environment:
      ITEMQ_DB_PATH: /data/itemq.db
      ITEMQ_MEDIA_PATH: /data/media
    volumes:
      - itemq_data:/data

  itemq-dev:
    build: .
    image: localhost/itemq:dev
    container_name: itemq-dev
    ports:
      - "8081:8080"
    environment:
      ITEMQ_DB_PATH: /data/itemq.dev.db
      ITEMQ_MEDIA_PATH: /data/media
    volumes:
      - itemq_data_dev:/data
    restart: unless-stopped

volumes:
  itemq_data:
  itemq_data_dev:
