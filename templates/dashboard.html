{% block content %}
<div class="dashboard-header">
  <h1>Your Inventory at a Glance</h1>
  <p class="subtitle">Everything you need — simple, calm, and organized.</p>
</div>

<div class="cards">
  <div class="card card-primary">
    <div class="card-icon">📦</div>
    <div class="card-content">
      <h3>Total Items</h3>
      <p class="card-metric">24</p>
      <span class="card-hint">Unique products tracked</span>
    </div>
  </div>

  <div class="card card-secondary">
    <div class="card-icon">🏷️</div>
    <div class="card-content">
      <h3>Total Barcodes</h3>
      <p class="card-metric">128</p>
      <span class="card-hint">Labels generated & ready</span>
    </div>
  </div>

  <div class="card card-warning">
    <div class="card-icon">⚠️</div>
    <div class="card-content">
      <h3>Low Stock</h3>
      <p class="card-metric">3</p>
      <span class="card-hint">Needs attention soon</span>
    </div>
  </div>
</div>
{% endblock %}
