<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ItemQ</title>

  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/app.js" defer></script>
</head>

<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <img class="logo-img" src="/static/logo-sunflower.svg" alt="ItemQ logo">
        <h2>ItemQ</h2>
        <button id="sidebar-toggle"
                class="sidebar-toggle"
                type="button"
                data-sidebar-toggle
                aria-label="Collapse sidebar"
                aria-pressed="false">⟨</button>
      </div>

      <nav class="sidebar-nav">
        <a hx-get="/dashboard" hx-target="#content" hx-swap="innerHtml" title="Dashboard">
          <span class="nav-icon icon-dashboard"></span>
          <span class="nav-label">Dashboard</span>
        </a>
        <a hx-get="/generate" hx-target="#content" hx-swap="innerHtml" title="Generate">
          <span class="nav-icon icon-generate"></span>
          <span class="nav-label">Generate</span>
        </a>
        <a hx-get="/inventory" hx-target="#content" hx-swap="innerHtml" title="Inventory">
          <span class="nav-icon icon-inventory"></span>
          <span class="nav-label">Inventory</span>
        </a>
        <a class="sidebar-subnav-link"
           hx-get="/inventory/duplicates/page"
           hx-target="#content"
           hx-swap="innerHtml"
           title="Inventory Duplicates">
          <span class="nav-icon icon-inventory"></span>
          <span class="nav-label">Duplicates</span>
        </a>
        <a hx-get="/history" hx-target="#content" hx-swap="innerHtml" title="History">
          <span class="nav-icon icon-history"></span>
          <span class="nav-label">History</span>
        </a>
        <a hx-get="/plugins" hx-target="#content" hx-swap="innerHtml" title="Plugins">
          <span class="nav-icon icon-plugins"></span>
          <span class="nav-label">Plugins</span>
        </a>
      </nav>
    </aside>

    <main id="content" hx-get="/dashboard" hx-trigger="load">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
