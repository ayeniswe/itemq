{% block content %}

<div class="inventory-header">
  <h1>Your Inventory</h1>
  <p class="subtitle">A simple, organized view of everything you have.</p>

  <div class="inventory-actions">
    <label class="inventory-toggle">
      <input type="checkbox"
             id="include-notion-toggle"
             name="include_notion"
             value="true"
             hx-get="/inventory/table"
             hx-target="#inventory-table-wrapper"
             hx-swap="innerHTML"
             hx-include="#inventory-filters, this"
             {% if request.query_params.get('include_notion') %}
             checked
             {% endif %}>
      <span>Include Notion Inventory</span>
    </label>

    <button id="inventory-add-toggle"
            class="btn-secondary inventory-add-toggle">
      + Add inventory item
    </button>
  </div>

  <div id="inventory-summary"
       hx-get="/inventory/summary"
       hx-trigger="load"
       hx-target="#inventory-summary"
       hx-swap="innerHTML"
       hx-include="#include-notion-toggle"></div>

  <div id="inventory-add-overlay" class="inventory-overlay is-hidden">
    <form id="inventory-add-card"
          class="inventory-add-form inventory-add-card"
          hx-post="/inventory"
          hx-target="#inventory-table-wrapper"
          hx-swap="innerHTML"
          hx-include="[name='include_notion']">

      <div class="inventory-add-grid">
        <div class="field">
          <label>Item name</label>
          <input type="text"
                 name="name"
                 placeholder="e.g. Blue Hoodie"
                 required>
        </div>

        <div class="field">
          <label>Quantity</label>
          <input type="number"
                 name="quantity"
                 min="0"
                 value="0">
        </div>
      </div>

      <details class="inventory-details-toggle">
        <summary>Optional group, collection, and event details</summary>
        <div class="inventory-add-grid">
          <div class="field">
            <label>Group name</label>
            <input type="text" name="group_name" placeholder="e.g. Believe for a Miracle">
          </div>
          <div class="field">
            <label>Collection name</label>
            <input type="text" name="collection_name" placeholder="e.g. Christmas Collection">
          </div>
          <div class="field">
            <label>Collection category</label>
            <input type="text" name="collection_category" placeholder="e.g. Family, Married">
          </div>
          <div class="field">
            <label>Occasion</label>
            <input type="text" name="occasion" placeholder="e.g. Anniversary">
          </div>
          <div class="field">
            <label>Season</label>
            <input type="text" name="season" placeholder="e.g. Winter">
          </div>
          <div class="field">
            <label>Holiday</label>
            <input type="text" name="holiday" placeholder="e.g. Christmas">
          </div>
          <div class="field">
            <label>Emotion</label>
            <input type="text" name="emotion" placeholder="e.g. Encouraging">
          </div>
          <div class="field">
            <label>Color</label>
            <input type="text" name="color" placeholder="e.g. Blue">
          </div>
          <div class="field">
            <label>Event name</label>
            <input type="text" name="event_name" placeholder="e.g. Craft Market">
          </div>
          <div class="field">
            <label>Event date</label>
            <input type="date" name="event_date">
          </div>
          <div class="field">
            <label>Event location</label>
            <input type="text" name="event_location" placeholder="e.g. Nashville">
          </div>
          <div class="field field-notes">
            <label>Event notes</label>
            <textarea name="event_notes" rows="4" placeholder="Notes or reminders"></textarea>
          </div>
        </div>
      </details>

      <div class="inventory-add-actions">
        <button type="submit" class="btn-primary">
          + Add item
        </button>
      </div>
    </form>
  </div>

  <div id="inventory-detail-overlay" class="inventory-overlay is-hidden">
    <div id="inventory-detail-panel" class="inventory-detail-panel"></div>
  </div>
</div>

<div class="inventory-card">
  <div class="inventory-table-wrapper">
    <form id="inventory-filters" class="inventory-search-row">
      <div class="inventory-search" role="search">
        <span class="inventory-search-icon" aria-hidden="true">🔎</span>
        <input id="inventory-search"
               type="search"
               placeholder="Search by name, barcode, group, or event"
               autocomplete="off"
               name="search"
               hx-get="/inventory/table"
               hx-trigger="input delay:300ms, search"
               hx-target="#inventory-table-wrapper"
               hx-swap="innerHTML"
               hx-include="#inventory-filters, #include-notion-toggle"
               aria-label="Search inventory items">
        <button type="button"
                id="inventory-search-clear"
                class="inventory-search-clear"
                aria-label="Clear search">
          ×
        </button>
      </div>
  <div class="inventory-filter-row">
    <label>
      Group
      <select name="group_name"
              hx-get="/inventory/table"
                  hx-trigger="change"
                  hx-target="#inventory-table-wrapper"
                  hx-swap="innerHTML"
                  hx-include="#inventory-filters, #include-notion-toggle">
            <option value="">All</option>
            {% for value in filter_options.group_name %}
              <option value="{{ value }}">{{ value }}</option>
            {% endfor %}
          </select>
        </label>
        <label>
          Collection
          <select name="collection_name"
                  hx-get="/inventory/table"
                  hx-trigger="change"
                  hx-target="#inventory-table-wrapper"
                  hx-swap="innerHTML"
                  hx-include="#inventory-filters, #include-notion-toggle">
            <option value="">All</option>
            {% for value in filter_options.collection_name %}
              <option value="{{ value }}">{{ value }}</option>
            {% endfor %}
          </select>
        </label>
        <label>
          Collection category
          <select name="collection_category"
                  hx-get="/inventory/table"
                  hx-trigger="change"
                  hx-target="#inventory-table-wrapper"
                  hx-swap="innerHTML"
                  hx-include="#inventory-filters, #include-notion-toggle">
            <option value="">All</option>
            {% for value in filter_options.collection_category %}
              <option value="{{ value }}">{{ value }}</option>
            {% endfor %}
          </select>
        </label>
        <label>
          Occasion
          <select name="occasion"
                  hx-get="/inventory/table"
                  hx-trigger="change"
                  hx-target="#inventory-table-wrapper"
                  hx-swap="innerHTML"
                  hx-include="#inventory-filters, #include-notion-toggle">
            <option value="">All</option>
            {% for value in filter_options.occasion %}
              <option value="{{ value }}">{{ value }}</option>
            {% endfor %}
          </select>
        </label>
        <label>
          Season
          <select name="season"
                  hx-get="/inventory/table"
                  hx-trigger="change"
                  hx-target="#inventory-table-wrapper"
                  hx-swap="innerHTML"
                  hx-include="#inventory-filters, #include-notion-toggle">
            <option value="">All</option>
            {% for value in filter_options.season %}
              <option value="{{ value }}">{{ value }}</option>
            {% endfor %}
          </select>
        </label>
        <label>
          Holiday
          <select name="holiday"
                  hx-get="/inventory/table"
                  hx-trigger="change"
                  hx-target="#inventory-table-wrapper"
                  hx-swap="innerHTML"
                  hx-include="#inventory-filters, #include-notion-toggle">
            <option value="">All</option>
            {% for value in filter_options.holiday %}
              <option value="{{ value }}">{{ value }}</option>
            {% endfor %}
          </select>
        </label>
        <label>
      Emotion
      <select name="emotion"
              hx-get="/inventory/table"
              hx-trigger="change"
              hx-target="#inventory-table-wrapper"
              hx-swap="innerHTML"
              hx-include="#inventory-filters, #include-notion-toggle">
        <option value="">All</option>
        {% for value in filter_options.emotion %}
          <option value="{{ value }}">{{ value }}</option>
        {% endfor %}
      </select>
    </label>
        <label>
          Color
          <select name="color"
                  hx-get="/inventory/table"
                  hx-trigger="change"
                  hx-target="#inventory-table-wrapper"
                  hx-swap="innerHTML"
                  hx-include="#inventory-filters, #include-notion-toggle">
            <option value="">All</option>
            {% for value in filter_options.color %}
              <option value="{{ value }}">{{ value }}</option>
            {% endfor %}
          </select>
        </label>
        <label>
          Event
          <select name="event_name"
                  hx-get="/inventory/table"
                  hx-trigger="change"
                  hx-target="#inventory-table-wrapper"
                  hx-swap="innerHTML"
                  hx-include="#inventory-filters, #include-notion-toggle">
            <option value="">All</option>
            {% for value in filter_options.event_name %}
              <option value="{{ value }}">{{ value }}</option>
            {% endfor %}
          </select>
        </label>
      </div>
      <span id="inventory-search-count" class="inventory-muted">Showing all items</span>
    </form>
    <div id="inventory-search-empty" class="inventory-empty" hidden>
      No matching items. Try a different search.
    </div>
    <div id="inventory-table-wrapper">
      <table class="inventory-table">
        <tbody>
          <tr data-inventory-table-loader
              hx-get="/inventory/table"
              hx-trigger="pref-init"
              hx-target="#inventory-table-wrapper"
              hx-swap="innerHTML"
              hx-include="#inventory-filters, #include-notion-toggle">
            <td colspan="8" class="loading">
              Loading inventory…
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div id="inventory-undo" class="inventory-undo" hidden>
  <span>Inventory item deleted.</span>
  <button class="btn-secondary"
          hx-post="/inventory/undo"
          hx-target="#inventory-table-wrapper"
          hx-swap="innerHTML"
          hx-include="#inventory-filters, #include-notion-toggle">
    Undo
  </button>
</div>

<div class="inventory-card inventory-duplicates-card">
  <div id="inventory-duplicates"
       hx-get="/inventory/duplicates"
       hx-trigger="load"
       hx-target="#inventory-duplicates"
       hx-swap="innerHTML"
       hx-include="#include-notion-toggle"></div>
</div>

<!-- Cache Include Notion Inventory  -->
<script>
  // Refresh filter dropdown options from the server (keeps new group/collection/etc. values in sync)
  window.refreshInventoryFilters = function refreshInventoryFilters() {
    const filtersForm = document.getElementById("inventory-filters");
    const includeNotionToggle = document.getElementById("include-notion-toggle");
    if (!filtersForm) return;

    const params = new URLSearchParams();
    if (includeNotionToggle && includeNotionToggle.checked) {
      params.append("include_notion", "true");
    }

    fetch(`/inventory/filter_options?${params.toString()}`)
      .then((res) => res.json())
      .then((data) => {
        const fields = [
          "group_name",
          "collection_name",
          "collection_category",
          "occasion",
          "season",
          "holiday",
          "emotion",
          "color",
          "event_name",
        ];
        fields.forEach((field) => {
          const select = filtersForm.querySelector(`select[name='${field}']`);
          if (!select) return;
          const current = select.value;
          while (select.options.length > 1) {
            select.remove(1);
          }
          (data[field] || []).forEach((val) => {
            const opt = document.createElement("option");
            opt.value = val;
            opt.textContent = val;
            select.appendChild(opt);
          });
          if (current && select.querySelector(`option[value="${CSS.escape(current)}"]`)) {
            select.value = current;
          } else {
            select.value = "";
          }
        });
      })
      .catch(() => {});
  };
  (function () {
    const STORAGE_KEY = "inventoryIncludeNotion";
    const toggle = document.getElementById("include-notion-toggle");
    const getTableLoader = () => document.querySelector("[data-inventory-table-loader]");
    const summary = document.getElementById("inventory-summary");
    const duplicates = document.getElementById("inventory-duplicates");

    if (!toggle || !window.htmx) return;

    const savedPref = localStorage.getItem(STORAGE_KEY);
    if (savedPref !== null) {
      toggle.checked = savedPref === "true";
    }

    const requestTable = () => {
      const tableLoader = getTableLoader();
      if (tableLoader) {
        htmx.trigger(tableLoader, "pref-init");
      }
    };

    const requestSummary = () => {
      if (!summary) return;
      htmx.ajax("GET", "/inventory/summary", {
        target: "#inventory-summary",
        swap: "innerHTML",
        values: { include_notion: toggle.checked },
      });
    };

    const requestDuplicates = () => {
      if (!duplicates) return;
      htmx.ajax("GET", "/inventory/duplicates", {
        target: "#inventory-duplicates",
        swap: "innerHTML",
        values: { include_notion: toggle.checked },
      });
    };

    toggle.addEventListener("change", () => {
      localStorage.setItem(STORAGE_KEY, String(toggle.checked));
      requestTable();
      requestSummary();
      requestDuplicates();
    });

    // Trigger initial load using cached preference
    requestTable();
    requestSummary();
    requestDuplicates();
  })();
</script>

<script>
  (function () {
    const searchInput = document.getElementById("inventory-search");
    const clearButton = document.getElementById("inventory-search-clear");
    const getTableBody = () => document.getElementById("inventory-table");
    const emptyState = document.getElementById("inventory-search-empty");
    const countLabel = document.getElementById("inventory-search-count");
    const undoBanner = document.getElementById("inventory-undo");
    const filtersForm = document.getElementById("inventory-filters");
    const includeNotionToggle = document.getElementById("include-notion-toggle");

    if (!searchInput || !clearButton || !countLabel) return;

    let rows = [];

    const syncRows = () => {
      const tableBody = getTableBody();
      if (!tableBody) {
        rows = [];
        return;
      }
      rows = Array.from(tableBody.querySelectorAll(".inventory-row"));
    };

    const updateCount = (visibleCount, totalCount) => {
      if (!countLabel) return;
      if (!searchInput.value.trim()) {
        countLabel.textContent = "Showing all items";
        return;
      }
      countLabel.textContent = `Showing ${visibleCount} of ${totalCount} items`;
    };

    const applyFilter = () => {
      const query = searchInput.value.trim().toLowerCase();
      let visibleCount = 0;

      rows.forEach((row) => {
        const text = (row.dataset.search || "").toLowerCase();
        const matches = !query || text.includes(query);
        row.hidden = !matches;
        if (matches) visibleCount += 1;
      });

      const totalCount = rows.length;
      updateCount(visibleCount, totalCount);

      if (emptyState) {
        emptyState.hidden = !query || visibleCount > 0;
      }

      clearButton.hidden = !searchInput.value;
    };

    searchInput.addEventListener("input", applyFilter);
    searchInput.addEventListener("search", applyFilter);

    clearButton.addEventListener("click", () => {
      searchInput.value = "";
      searchInput.focus();
      applyFilter();
      searchInput.dispatchEvent(new Event("input", { bubbles: true }));
    });

    document.body.addEventListener("htmx:afterSwap", (event) => {
      if (event.target && event.target.id === "inventory-table-wrapper") {
        syncRows();
        applyFilter();
        window.refreshInventoryFilters?.();
      }
    });

    document.body.addEventListener("inventory:refreshTable", () => {
      if (!filtersForm || !window.htmx) return;
      const formData = new FormData(filtersForm);
      if (includeNotionToggle && includeNotionToggle.checked) {
        formData.append("include_notion", "true");
      }
      const values = Object.fromEntries(formData.entries());
      window.htmx.ajax("GET", "/inventory/table", {
        target: "#inventory-table-wrapper",
        swap: "innerHTML",
        values,
      });
    });

    document.body.addEventListener("inventory:undoAvailable", () => {
      if (undoBanner) {
        undoBanner.hidden = false;
      }
    });

    document.body.addEventListener("htmx:afterSwap", (event) => {
      if (event.target && event.target.id === "inventory-table-wrapper" && undoBanner) {
        undoBanner.hidden = true;
      }
    });

    syncRows();
    applyFilter();
  })();
</script>

<!-- Toggle Add Item Card -->
<script>
  (function () {
    const toggleBtn = document.getElementById("inventory-add-toggle");
    const overlay = document.getElementById("inventory-add-overlay");
    const card = document.getElementById("inventory-add-card");
    const details = card?.querySelector(".inventory-details-toggle");
    const focusGuard = () => {
      const first = card?.querySelector("input, select, textarea, button");
      first?.focus({ preventScroll: true });
    };

    if (!toggleBtn || !overlay || !card) return;

    const closeOverlay = (reset = false) => {
      overlay.classList.add("is-hidden");
      if (reset) {
        card.reset();
        if (details && details.open) details.open = false;
      }
    };

    toggleBtn.addEventListener("click", (e) => {
      e.preventDefault();
      const isHidden = overlay.classList.contains("is-hidden");
      if (isHidden) {
        card.reset();
        if (details && details.open) details.open = false;
        overlay.classList.remove("is-hidden");
        focusGuard();
      } else {
        closeOverlay(true);
      }
    });

    overlay.addEventListener("click", (e) => {
      if (e.target === overlay) {
        closeOverlay(true);
      }
    });

    card.addEventListener("submit", () => {
      closeOverlay(true);
    });
  })();
</script>

<!-- Detail Modal -->
<script>
  (function () {
    const overlay = document.getElementById("inventory-detail-overlay");
    const panel = document.getElementById("inventory-detail-panel");
    const includeNotionToggle = document.getElementById("include-notion-toggle");
    const filtersForm = document.getElementById("inventory-filters");

    if (!overlay || !panel || !window.htmx) return;

    const closeOverlay = () => {
      overlay.classList.add("is-hidden");
      panel.innerHTML = "";
    };

    overlay.addEventListener("click", (e) => {
      if (e.target === overlay) {
        closeOverlay();
      }
    });

    document.body.addEventListener("click", (e) => {
      const target = e.target;
      if (!(target instanceof HTMLElement)) return;
      if (target.classList.contains("inventory-overlay-close")) {
        e.preventDefault();
        closeOverlay();
      }
    });

    document.body.addEventListener("htmx:afterSwap", (event) => {
      if (event.target === panel) {
        overlay.classList.remove("is-hidden");
      }
      if (event.target && event.target.id === "inventory-table-wrapper") {
        closeOverlay();
        window.refreshInventoryFilters?.();
      }
      if (event.target && typeof event.target.id === "string" && event.target.id.startsWith("inventory-row-")) {
        closeOverlay();
        window.refreshInventoryFilters?.();
      }
    });

    document.addEventListener("inventory:filtersUpdated", () => {
      window.refreshInventoryFilters?.();
    });

    document.addEventListener("htmx:afterSwap", (event) => {
      if (event.target && event.target.id === "inventory-table-wrapper") {
        window.refreshInventoryFilters?.();
      }
    });
  })();
</script>

<script>
  (function () {
    document.body.addEventListener("click", (event) => {
      const target = event.target;
      if (!(target instanceof HTMLElement)) return;
      if (!target.classList.contains("inventory-duplicate-dismiss")) return;
      const group = target.closest("[data-duplicate-group]");
      if (group) {
        group.remove();
      }
    });
  })();
</script>

{% endblock %}
