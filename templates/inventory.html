{% block content %}

<div class="inventory-header">
  <div class="inventory-header-top">
    <div>
      <h1>Your Inventory</h1>
      <p class="subtitle">A simple, organized view of everything you have.</p>
    </div>
    <div class="inventory-header-actions">
      <button id="inventory-undo-btn"
              type="button"
              class="icon-btn"
              title="Undo (latest change)" data-tooltip="Undo latest change"
              aria-label="Undo"
              hx-post="/inventory/undo_action"
              hx-target="#inventory-table-wrapper"
              hx-swap="innerHTML"
              hx-include="#inventory-filters, #include-notion-toggle">
        <span class="icon-undo" aria-hidden="true"></span>
      </button>
      <button id="inventory-redo-btn"
              type="button"
              class="icon-btn"
              title="Redo (most recently undone)" data-tooltip="Redo most recently undone"
              aria-label="Redo"
              hx-post="/inventory/redo_action"
              hx-target="#inventory-table-wrapper"
              hx-swap="innerHTML"
              hx-include="#inventory-filters, #include-notion-toggle">
        <span class="icon-redo" aria-hidden="true"></span>
      </button>
      <button id="inventory-add-toggle"
              class="btn-secondary inventory-add-toggle">
        + Add inventory item
      </button>
    </div>
  </div>

  <div class="inventory-actions">
    <label class="inventory-toggle">
      <input type="checkbox"
             id="include-notion-toggle"
             name="include_notion"
             value="true"
             hx-get="/inventory/table"
             hx-target="#inventory-table-wrapper"
             hx-swap="innerHTML"
             hx-include="#inventory-filters, this"
             {% if request.query_params.get('include_notion') %}
             checked
             {% endif %}>
      <span>Include Notion Inventory</span>
    </label>

  </div>

  <div id="inventory-add-overlay" class="inventory-overlay is-hidden">
    <form id="inventory-add-card"
          class="inventory-add-form inventory-add-card"
          hx-post="/inventory"
          hx-target="#inventory-table-wrapper"
          hx-swap="innerHTML"
          hx-include="[name='include_notion'], #inventory-filters, #inventory-page"
          hx-vals='js:{page: document.querySelector(`#inventory-table-wrapper [name="page"]`)?.value || "1", filter_search: document.getElementById("inventory-search")?.value || "", filter_search_case: document.querySelector(`#inventory-filters [name="search_case"]`)?.value || "insensitive", filter_group_name: document.querySelector(`#inventory-filters [name="group_name"]`)?.value || "", filter_collection_name: document.querySelector(`#inventory-filters [name="collection_name"]`)?.value || "", filter_collection_category: document.querySelector(`#inventory-filters [name="collection_category"]`)?.value || "", filter_occasion: document.querySelector(`#inventory-filters [name="occasion"]`)?.value || "", filter_season: document.querySelector(`#inventory-filters [name="season"]`)?.value || "", filter_holiday: document.querySelector(`#inventory-filters [name="holiday"]`)?.value || "", filter_emotion: document.querySelector(`#inventory-filters [name="emotion"]`)?.value || "", filter_color: document.querySelector(`#inventory-filters [name="color"]`)?.value || "", filter_event_name: document.querySelector(`#inventory-filters [name="event_name"]`)?.value || "", filter_created_from: document.querySelector(`#inventory-filters [name="created_from"]`)?.value || "", filter_created_to: document.querySelector(`#inventory-filters [name="created_to"]`)?.value || "", filter_tz_offset_minutes: document.querySelector(`#inventory-filters [name="tz_offset_minutes"]`)?.value || new Date().getTimezoneOffset()}'>

      <div class="inventory-add-grid">
        <div class="field">
          <label>Item name</label>
          <input type="text"
                 name="name"
                 placeholder="e.g. Blue Hoodie"
                 required>
        </div>

        <div class="field">
          <label>Quantity</label>
          <input type="number"
                 name="quantity"
                 min="0"
                 value="0">
        </div>
      </div>

      <details class="inventory-details-toggle">
        <summary>Optional group, collection, and event details</summary>
        <div class="inventory-add-grid">
          <div class="field">
            <label>Group name</label>
            <input type="text" name="group_name" placeholder="e.g. Believe for a Miracle">
          </div>
          <div class="field">
            <label>Collection name</label>
            <input type="text" name="collection_name" placeholder="e.g. Christmas Collection">
          </div>
          <div class="field">
            <label>Collection category</label>
            <input type="text" name="collection_category" placeholder="e.g. Family, Married">
          </div>
          <div class="field">
            <label>Occasion</label>
            <input type="text" name="occasion" placeholder="e.g. Anniversary">
          </div>
          <div class="field">
            <label>Season</label>
            <input type="text" name="season" placeholder="e.g. Winter">
          </div>
          <div class="field">
            <label>Holiday</label>
            <input type="text" name="holiday" placeholder="e.g. Christmas">
          </div>
          <div class="field">
            <label>Emotion</label>
            <input type="text" name="emotion" placeholder="e.g. Encouraging">
          </div>
          <div class="field">
            <label>Color</label>
            <input type="text" name="color" placeholder="e.g. Blue">
          </div>
          <div class="field">
            <label>Event name</label>
            <input type="text" name="event_name" placeholder="e.g. Craft Market">
          </div>
          <div class="field">
            <label>Event date</label>
            <input type="date" name="event_date">
          </div>
          <div class="field">
            <label>Event location</label>
            <input type="text" name="event_location" placeholder="e.g. Nashville">
          </div>
          <div class="field field-notes">
            <label>Event notes</label>
            <textarea name="event_notes" rows="4" placeholder="Notes or reminders"></textarea>
          </div>
        </div>
      </details>

      <div class="inventory-add-actions">
        <button type="submit" class="btn-primary">
          + Add item
        </button>
      </div>
    </form>
  </div>

  <div id="inventory-detail-overlay" class="inventory-overlay is-hidden">
    <div id="inventory-detail-panel" class="inventory-detail-panel"></div>
  </div>
</div>

<div id="inventory-table-card" class="inventory-card">
  <div class="inventory-table-controls">
    <div class="inventory-table-actions-left">
      <button id="inventory-bulk-delete"
              type="button"
              class="btn-secondary"
              data-bulk-delete
              hidden
              hx-post="/inventory/bulk_delete"
              hx-target="#inventory-table-wrapper"
              hx-swap="innerHTML"
              hx-include="#inventory-bulk-form, #inventory-filters, #include-notion-toggle">
        Delete selected
      </button>
    </div>
    <div class="inventory-table-actions-right">
      <button id="inventory-table-size-toggle"
              type="button"
              class="inventory-table-toggle"
              aria-label="Maximize table">+</button>
    </div>
  </div>
  <div class="inventory-table-wrapper">
    <form id="inventory-filters" class="inventory-search-row">
      <input id="inventory-page" type="hidden" name="page" value="1">
      <input id="inventory-tz-offset" type="hidden" name="tz_offset_minutes" value="">
      <div class="inventory-search" role="search">
        <span class="inventory-search-icon" aria-hidden="true">🔎</span>
        <input id="inventory-search"
               type="search"
               placeholder="Search by name, barcode, group, or event"
               autocomplete="off"
               name="search"
               hx-get="/inventory/table"
               hx-trigger="input delay:300ms, search"
               hx-target="#inventory-table-wrapper"
               hx-swap="innerHTML"
               hx-include="#inventory-filters, #include-notion-toggle"
               aria-label="Search inventory items">
      </div>
      <label class="inventory-search-case">
        Search mode
        <select name="search_case"
                hx-get="/inventory/table"
                hx-trigger="change"
                hx-target="#inventory-table-wrapper"
                hx-swap="innerHTML"
                hx-include="#inventory-filters, #include-notion-toggle">
          <option value="insensitive" {% if request.query_params.get("search_case", "insensitive") != "sensitive" %}selected{% endif %}>Case-insensitive</option>
          <option value="sensitive" {% if request.query_params.get("search_case") == "sensitive" %}selected{% endif %}>Case-sensitive</option>
        </select>
      </label>
  <div class="inventory-filter-row">
    <label>
      Group
      <select name="group_name"
              hx-get="/inventory/table"
                  hx-trigger="change"
                  hx-target="#inventory-table-wrapper"
                  hx-swap="innerHTML"
                  hx-include="#inventory-filters, #include-notion-toggle">
            <option value="">All</option>
            {% for value in filter_options.group_name %}
              <option value="{{ value }}">{{ value }}</option>
            {% endfor %}
          </select>
        </label>
        <label>
          Collection
          <select name="collection_name"
                  hx-get="/inventory/table"
                  hx-trigger="change"
                  hx-target="#inventory-table-wrapper"
                  hx-swap="innerHTML"
                  hx-include="#inventory-filters, #include-notion-toggle">
            <option value="">All</option>
            {% for value in filter_options.collection_name %}
              <option value="{{ value }}">{{ value }}</option>
            {% endfor %}
          </select>
        </label>
        <label>
          Collection category
          <select name="collection_category"
                  hx-get="/inventory/table"
                  hx-trigger="change"
                  hx-target="#inventory-table-wrapper"
                  hx-swap="innerHTML"
                  hx-include="#inventory-filters, #include-notion-toggle">
            <option value="">All</option>
            {% for value in filter_options.collection_category %}
              <option value="{{ value }}">{{ value }}</option>
            {% endfor %}
          </select>
        </label>
        <label>
          Occasion
          <select name="occasion"
                  hx-get="/inventory/table"
                  hx-trigger="change"
                  hx-target="#inventory-table-wrapper"
                  hx-swap="innerHTML"
                  hx-include="#inventory-filters, #include-notion-toggle">
            <option value="">All</option>
            {% for value in filter_options.occasion %}
              <option value="{{ value }}">{{ value }}</option>
            {% endfor %}
          </select>
        </label>
        <label>
          Season
          <select name="season"
                  hx-get="/inventory/table"
                  hx-trigger="change"
                  hx-target="#inventory-table-wrapper"
                  hx-swap="innerHTML"
                  hx-include="#inventory-filters, #include-notion-toggle">
            <option value="">All</option>
            {% for value in filter_options.season %}
              <option value="{{ value }}">{{ value }}</option>
            {% endfor %}
          </select>
        </label>
        <label>
          Holiday
          <select name="holiday"
                  hx-get="/inventory/table"
                  hx-trigger="change"
                  hx-target="#inventory-table-wrapper"
                  hx-swap="innerHTML"
                  hx-include="#inventory-filters, #include-notion-toggle">
            <option value="">All</option>
            {% for value in filter_options.holiday %}
              <option value="{{ value }}">{{ value }}</option>
            {% endfor %}
          </select>
        </label>
        <label>
      Emotion
      <select name="emotion"
              hx-get="/inventory/table"
              hx-trigger="change"
              hx-target="#inventory-table-wrapper"
              hx-swap="innerHTML"
              hx-include="#inventory-filters, #include-notion-toggle">
        <option value="">All</option>
        {% for value in filter_options.emotion %}
          <option value="{{ value }}">{{ value }}</option>
        {% endfor %}
      </select>
    </label>
        <label>
          Color
          <select name="color"
                  hx-get="/inventory/table"
                  hx-trigger="change"
                  hx-target="#inventory-table-wrapper"
                  hx-swap="innerHTML"
                  hx-include="#inventory-filters, #include-notion-toggle">
            <option value="">All</option>
            {% for value in filter_options.color %}
              <option value="{{ value }}">{{ value }}</option>
            {% endfor %}
          </select>
        </label>
        <label>
          Event
          <select name="event_name"
                  hx-get="/inventory/table"
                  hx-trigger="change"
                  hx-target="#inventory-table-wrapper"
                  hx-swap="innerHTML"
                  hx-include="#inventory-filters, #include-notion-toggle">
            <option value="">All</option>
            {% for value in filter_options.event_name %}
              <option value="{{ value }}">{{ value }}</option>
            {% endfor %}
          </select>
        </label>
        <label>
          Created from
          <input type="datetime-local"
                 name="created_from"
                 hx-get="/inventory/table"
                 hx-trigger="change"
                 hx-target="#inventory-table-wrapper"
                 hx-swap="innerHTML"
                 hx-include="#inventory-filters, #include-notion-toggle">
        </label>
        <label>
          Created to
          <input type="datetime-local"
                 name="created_to"
                 hx-get="/inventory/table"
                 hx-trigger="change"
                 hx-target="#inventory-table-wrapper"
                 hx-swap="innerHTML"
                 hx-include="#inventory-filters, #include-notion-toggle">
        </label>
      </div>
      <span id="inventory-search-count" class="inventory-muted">Showing filtered inventory</span>
    </form>
    <div id="inventory-search-empty" class="inventory-empty" hidden>
      No matching items. Try a different search.
    </div>
    <div id="inventory-table-wrapper">
      <table class="inventory-table">
        <tbody>
          <tr data-inventory-table-loader
              hx-get="/inventory/table"
              hx-trigger="pref-init"
              hx-target="#inventory-table-wrapper"
              hx-swap="innerHTML"
              hx-include="#inventory-filters, #include-notion-toggle">
            <td colspan="8" class="loading">
              Loading inventory…

          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>


<div class="inventory-card inventory-duplicates-card">
  <div id="inventory-duplicates"
       hx-get="/inventory/duplicates"
       hx-trigger="load"
       hx-target="#inventory-duplicates"
       hx-swap="innerHTML"
       hx-include="#include-notion-toggle"></div>
</div>

<!-- Cache Include Notion Inventory  -->
<script>
  // Refresh filter dropdown options from the server (keeps new group/collection/etc. values in sync)
  window.refreshInventoryFilters = function refreshInventoryFilters() {
    const filtersForm = document.getElementById("inventory-filters");
    const includeNotionToggle = document.getElementById("include-notion-toggle");
    if (!filtersForm) return;

    const params = new URLSearchParams();
    if (includeNotionToggle && includeNotionToggle.checked) {
      params.append("include_notion", "true");
    }

    fetch(`/inventory/filter_options?${params.toString()}`)
      .then((res) => res.json())
      .then((data) => {
        const fields = [
          "group_name",
          "collection_name",
          "collection_category",
          "occasion",
          "season",
          "holiday",
          "emotion",
          "color",
          "event_name",
        ];
        fields.forEach((field) => {
          const select = filtersForm.querySelector(`select[name='${field}']`);
          if (!select) return;
          const current = select.value;
          while (select.options.length > 1) {
            select.remove(1);
          }
          (data[field] || []).forEach((val) => {
            const opt = document.createElement("option");
            opt.value = val;
            opt.textContent = val;
            select.appendChild(opt);
          });
          if (current && select.querySelector(`option[value="${CSS.escape(current)}"]`)) {
            select.value = current;
          } else {
            select.value = "";
          }
        });
      })
      .catch(() => {});
  };
  (function () {
    const STORAGE_KEY = "inventoryIncludeNotion";
    const toggle = document.getElementById("include-notion-toggle");
    const getTableLoader = () => document.querySelector("[data-inventory-table-loader]");
    const summary = document.getElementById("inventory-summary");
    const duplicates = document.getElementById("inventory-duplicates");

    if (!toggle || !window.htmx) return;

    const savedPref = localStorage.getItem(STORAGE_KEY);
    if (savedPref !== null) {
      toggle.checked = savedPref === "true";
    }

    const requestTable = () => {
      const tableLoader = getTableLoader();
      if (tableLoader) {
        htmx.trigger(tableLoader, "pref-init");
      }
    };

    const requestSummary = () => {
      if (!summary) return;
      htmx.ajax("GET", "/inventory/summary", {
        target: "#inventory-summary",
        swap: "innerHTML",
        values: { include_notion: toggle.checked },
      });
    };

    const requestDuplicates = () => {
      if (!duplicates) return;
      htmx.ajax("GET", "/inventory/duplicates", {
        target: "#inventory-duplicates",
        swap: "innerHTML",
        values: { include_notion: toggle.checked },
      });
    };
    // Expose for other scripts to refresh after data mutations
    window.refreshInventoryDuplicates = requestDuplicates;

    toggle.addEventListener("change", () => {
      localStorage.setItem(STORAGE_KEY, String(toggle.checked));
      requestTable();
      requestSummary();
      requestDuplicates();
    });

    // Trigger initial load using cached preference
    requestTable();
    requestSummary();
    requestDuplicates();
  })();
</script>

<script>
  (function () {
    const searchInput = document.getElementById("inventory-search");
    const countLabel = document.getElementById("inventory-search-count");
    const filtersForm = document.getElementById("inventory-filters");
    const includeNotionToggle = document.getElementById("include-notion-toggle");
    const pageInput = document.getElementById("inventory-page");

    if (!searchInput || !countLabel) return;
    // Capture user timezone offset (minutes to add to local to reach UTC) so date filters compare correctly
    const tzInput = document.getElementById("inventory-tz-offset");
    if (tzInput) {
      tzInput.value = String(new Date().getTimezoneOffset());
    }

    const updateCount = () => {
      const rows = Array.from(document.querySelectorAll("#inventory-table .inventory-row"));
      if (!searchInput.value.trim()) {
        countLabel.textContent = `Showing ${rows.length} items on this page`;
      } else {
        countLabel.textContent = `Showing ${rows.length} matching items on this page`;
      }
      const emptyState = document.getElementById("inventory-search-empty");
      if (emptyState) {
        emptyState.hidden = rows.length > 0;
      }
    };

    searchInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
      }
    });

    searchInput.addEventListener("input", () => {
      if (pageInput) pageInput.value = "1";
    });

    document.body.addEventListener("htmx:afterSwap", (event) => {
      if (event.target && event.target.id === "inventory-table-wrapper") {
        const tablePageInput = event.target.querySelector("input[name='page']");
        if (pageInput && tablePageInput) {
          pageInput.value = tablePageInput.value;
        }
        updateCount();
        window.refreshInventoryFilters?.();
        window.refreshInventoryDuplicates?.();
      }
    });

    document.body.addEventListener("inventory:refreshDuplicates", () => {
      window.refreshInventoryDuplicates?.();
    });


    document.body.addEventListener("inventory:refreshTable", () => {
      if (!filtersForm || !window.htmx) return;
      const formData = new FormData(filtersForm);
      if (includeNotionToggle && includeNotionToggle.checked) {
        formData.append("include_notion", "true");
      }
      const values = Object.fromEntries(formData.entries());
      window.htmx.ajax("GET", "/inventory/table", {
        target: "#inventory-table-wrapper",
        swap: "innerHTML",
        values,
      });
    });

    updateCount();
  })();
</script>

<!-- Bulk selection + delete -->
<script>
  (function () {
    const bulkButton = document.getElementById("inventory-bulk-delete");

    const wireUp = () => {
      const selectAll = document.getElementById("inventory-select-all");
      const rowChecks = Array.from(document.querySelectorAll(".inventory-select-row"));
      if (!selectAll || !bulkButton) return;

      const sync = () => {
        const anyChecked = rowChecks.some((c) => c.checked);
        bulkButton.hidden = !anyChecked;
        if (anyChecked && rowChecks.every((c) => c.checked)) {
          selectAll.checked = true;
          selectAll.indeterminate = false;
        } else if (anyChecked) {
          selectAll.indeterminate = true;
          selectAll.checked = false;
        } else {
          selectAll.indeterminate = false;
          selectAll.checked = false;
        }
      };

      selectAll.addEventListener("change", () => {
        rowChecks.forEach((c) => (c.checked = selectAll.checked));
        sync();
      });
      rowChecks.forEach((c) => c.addEventListener("change", sync));
      sync();
    };

    document.body.addEventListener("htmx:afterSwap", (event) => {
      if (event.target && event.target.id === "inventory-table-wrapper") {
        wireUp();
      }
    });

    wireUp();
  })();
</script>

<!-- Toggle Add Item Card -->
<script>
  (function () {
    const toggleBtn = document.getElementById("inventory-add-toggle");
    const overlay = document.getElementById("inventory-add-overlay");
    const card = document.getElementById("inventory-add-card");
    const details = card?.querySelector(".inventory-details-toggle");
    const focusGuard = () => {
      const first = card?.querySelector("input, select, textarea, button");
      first?.focus({ preventScroll: true });
    };

    if (!toggleBtn || !overlay || !card) return;

    const closeOverlay = (reset = false) => {
      overlay.classList.add("is-hidden");
      if (reset) {
        card.reset();
        if (details && details.open) details.open = false;
      }
    };

    toggleBtn.addEventListener("click", (e) => {
      e.preventDefault();
      const isHidden = overlay.classList.contains("is-hidden");
      if (isHidden) {
        card.reset();
        if (details && details.open) details.open = false;
        overlay.classList.remove("is-hidden");
        focusGuard();
      } else {
        closeOverlay(true);
      }
    });

    overlay.addEventListener("click", (e) => {
      if (e.target === overlay) {
        closeOverlay(true);
      }
    });

    card.addEventListener("submit", () => {
      closeOverlay(true);
    });
  })();
</script>

<!-- Detail Modal -->
<script>
  (function () {
    const overlay = document.getElementById("inventory-detail-overlay");
    const panel = document.getElementById("inventory-detail-panel");
    const includeNotionToggle = document.getElementById("include-notion-toggle");
    const filtersForm = document.getElementById("inventory-filters");

    if (!overlay || !panel || !window.htmx) return;

    const closeOverlay = () => {
      overlay.classList.add("is-hidden");
      panel.innerHTML = "";
    };

    overlay.addEventListener("click", (e) => {
      if (e.target === overlay) {
        closeOverlay();
      }
    });

    document.body.addEventListener("click", (e) => {
      const target = e.target;
      if (!(target instanceof HTMLElement)) return;
      if (target.classList.contains("inventory-overlay-close")) {
        e.preventDefault();
        closeOverlay();
      }
    });

    document.body.addEventListener("htmx:afterSwap", (event) => {
      if (event.target === panel) {
        overlay.classList.remove("is-hidden");
      }
      if (event.target && event.target.id === "inventory-table-wrapper") {
        closeOverlay();
        window.refreshInventoryFilters?.();
      }
      if (event.target && typeof event.target.id === "string" && event.target.id.startsWith("inventory-row-")) {
        closeOverlay();
        window.refreshInventoryFilters?.();
      }
    });

    document.addEventListener("inventory:filtersUpdated", () => {
      window.refreshInventoryFilters?.();
    });

    document.addEventListener("htmx:afterSwap", (event) => {
      if (event.target && event.target.id === "inventory-table-wrapper") {
        window.refreshInventoryFilters?.();
      }
    });
  })();
</script>

<script>
  (function () {
    document.body.addEventListener("click", (event) => {
      const target = event.target;
      if (!(target instanceof HTMLElement)) return;
      if (!target.classList.contains("inventory-duplicate-dismiss")) return;
      const group = target.closest("[data-duplicate-group]");
      if (group) {
        group.remove();
      }
    });
  })();
</script>

<script>
  (function () {
    const card = document.getElementById("inventory-table-card");
    const btn = document.getElementById("inventory-table-size-toggle");
    if (!card || !btn) return;
    const setState = () => {
      const maximized = card.classList.contains("inventory-card-maximized");
      btn.textContent = maximized ? "−" : "+";
      btn.setAttribute("aria-label", maximized ? "Minimize table" : "Maximize table");
    };

    btn.addEventListener("click", () => {
      card.classList.toggle("inventory-card-maximized");
      setState();
    });

    setState();
  })();
</script>
