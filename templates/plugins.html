{% block content %}

<div class="plugins-header">
  <h1>Plugins</h1>
  <p class="subtitle">
    Connect optional integrations to extend how ItemQ works.
  </p>
</div>

<div class="plugins-grid">

  <div class="plugin-card">
    <div class="plugin-header">
      <h3>Notion</h3>
      <span class="plugin-badge">Inventory Sync</span>
    </div>

    <p class="plugin-description">
      Sync generated barcodes directly into a Notion database.
    </p>

    <form hx-post="/api/plugins/notion/connect"
          hx-target="#plugin-status"
          hx-swap="innerHTML"
          hx-indicator="#notion-connecting"
          class="plugin-form"
          id="notion-plugin-form">

      <label>
        Notion Token
        <input type="password" name="token" placeholder="ntn_••••••••" required>
      </label>

      <label>
        Database Link
        <input type="url" name="database" placeholder="https://notion.so/..." required>
      </label>

      <button type="submit" class="btn-primary">Connect Notion</button>
    </form>

    <div id="notion-connecting" class="notion-progress htmx-indicator" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      <div class="notion-progress-text">
        <p>Connecting to Notion…</p>
      </div>
    </div>

    <div id="plugin-status" class="plugin-status"
         hx-get="/api/plugins/notion/status"
         hx-trigger="load, every 10s"
         hx-swap="innerHTML"></div>
  </div>

</div>

{% endblock %}
