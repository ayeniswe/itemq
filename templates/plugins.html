{% block content %}

<div class="plugins-header">
  <h1>Plugins</h1>
  <p class="subtitle">
    Connect optional integrations to extend how ItemQ works.
  </p>
</div>

<div class="plugins-grid">

  <div class="plugin-card">
    <div class="plugin-header">
      <h3>Notion</h3>
      <span class="plugin-badge">Inventory Sync</span>
    </div>

    <p class="plugin-description">
      Sync generated barcodes directly into a Notion database.
    </p>

    <form hx-post="/api/plugins/notion/connect"
          hx-target="#plugin-status"
          hx-swap="outerHTML"
          hx-indicator="#notion-connecting"
          class="plugin-form"
          data-plugin-form="notion">

      <label>
        Notion Token
        <input type="password" name="token" placeholder="ntn_••••••••" required>
      </label>

      <label>
        Database Link
        <input type="url"
               name="database"
               placeholder="https://notion.so/..."
               value="{{ notion_plugin.config.database if notion_plugin }}"
               required>
      </label>

      <button type="submit" class="btn-primary">
        Connect Notion
      </button>
    </form>

    <div id="notion-connecting" class="plugin-status plugin-status--loading htmx-indicator">
      <span class="plugin-spinner" aria-hidden="true"></span>
      Connecting to Notion…
    </div>
    <div id="plugin-status"
         class="plugin-status{% if notion_plugin and notion_plugin.enabled %} plugin-status--disconnect{% endif %}">
      {% if notion_plugin and notion_plugin.enabled %}
        Disconnect
      {% endif %}
    </div>
  </div>

</div>

{% endblock %}
