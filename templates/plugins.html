{% block content %}

<div class="plugins-header">
  <h1>Plugins</h1>
  <p class="subtitle">
    Connect optional integrations to extend how ItemQ works.
  </p>
</div>

<div class="plugins-grid">

  <div class="plugin-card">
    <div class="plugin-header">
      <h3>Notion</h3>
      <span class="plugin-badge">Inventory Sync</span>
    </div>

    <p class="plugin-description">
      Connect your Notion inventory to generate and/or sync barcodes automatically.
    </p>

    <div id="notion-plugin-body"
         hx-get="/plugins/notion/status"
         hx-trigger="load"
         hx-swap="outerHTML">
    </div>
  </div>

</div>

{% endblock %}
