<div class="barcode-inventory">
  <div class="barcode-inventory-header">
    <span>Inventory items</span>
    <span class="barcode-inventory-count">{{ items|length }} available</span>
  </div>

  {% if items %}
    <div class="barcode-inventory-list">
      {% for item in items %}
        <label class="barcode-inventory-row">
          <input type="checkbox" name="item_ids" value="{{ item.id }}">
          <div class="barcode-inventory-meta">
            <span class="barcode-item-name">{{ item.name }}</span>
            <span class="barcode-item-value">{{ item.barcode }}</span>
          </div>
          <span class="source-pill source-{{ item.source }}">
            {{ item.source|capitalize }}
          </span>
        </label>
      {% endfor %}
    </div>
  {% else %}
    <p class="barcode-empty">No inventory items available yet.</p>
  {% endif %}
</div>
