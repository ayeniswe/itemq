<div class="barcode-inventory">
  <div class="barcode-inventory-header">
    <span>Inventory items</span>
    <div class="barcode-inventory-actions">
      <span class="barcode-inventory-count">{{ items|length }} available</span>
      <button type="button" class="btn-secondary btn-select-all" id="select-all-items">
        Select all
      </button>
    </div>
  </div>

  {% if items %}
    <div class="barcode-inventory-list">
      {% for item in items %}
        {% set has_label = item.label_path %}
        <label class="barcode-inventory-row">
          <div class="barcode-inventory-meta">
            <span class="barcode-item-name">{{ item.name }}</span>
            <span class="barcode-item-value">{{ item.barcode }}</span>
          </div>
          <div class="barcode-quantity">
            <span class="barcode-quantity-label">Qty</span>
            <input type="number"
                   name="quantity_{{ item.id }}"
                   min="1"
                   value="{{ item.label_quantity or 1 }}">
          </div>
          <span class="label-status {% if has_label %}label-ready{% else %}label-missing{% endif %}">
            {% if has_label %}
              Label ready
            {% else %}
              Not generated
            {% endif %}
          </span>
                    <input type="checkbox"
                 name="item_ids"
                 value="{{ item.id }}"
                 class="barcode-item-checkbox"
                 data-has-label="{{ 'true' if has_label else 'false' }}">
        </label>
      {% endfor %}
    </div>
  {% else %}
    <p class="barcode-empty">No inventory items available yet.</p>
  {% endif %}
</div>
