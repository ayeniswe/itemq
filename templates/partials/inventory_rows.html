{% for item in items %}
<tr class="inventory-row">
  <td class="inventory-cell">
    <label class="inventory-image-upload">
      {% if item.image_path %}
        <img src="/media/{{ item.image_path }}"
             alt="{{ item.name }}"
             width="36"
             height="36">
      {% else %}
        <div class="inventory-image-placeholder">
          <span class="plus-icon">+</span>
        </div>
      {% endif %}

      <input type="file"
             name="file"
             accept="image/*"
             hx-post="/inventory/{{ item.id }}/image"
             hx-trigger="change"
             hx-encoding="multipart/form-data"
             hx-target="#inventory-table"
             hx-swap="innerHTML"
             hx-include="[name='include_notion']" hidden>
    </label>
  </td>

  <td class="inventory-cell">
    <span class="inventory-pill">
      {{ item.barcode }}
    </span>
  </td>

  <td class="inventory-cell">
    <input type="text"
           name="name"
           value="{{ item.name }}"
           class="inventory-input"
           hx-post="/inventory/{{ item.id }}/name"
           hx-trigger="change"
           hx-include="this">
  </td>

  <td class="inventory-cell">
    <input type="number"
           min="0"
           name="quantity"
           value="{{ item.quantity }}"
           class="inventory-input"
           hx-post="/inventory/{{ item.id }}/quantity"
           hx-trigger="change"
           hx-include="this">
  </td>

  <td class="inventory-cell inventory-source-cell">
    <span class="source-pill source-{{ item.source }}">
      {{ item.source|capitalize }}
    </span>
  </td>
</tr>
{% endfor %}
