{% for item in items %}
<tr class="inventory-row"
    data-search="{{ item.name }} {{ item.barcode }} {{ item.source }}">
  <td class="inventory-cell">
    <div class="inventory-image-slot">
      {% if item.image_path %}
        <a class="inventory-image-zoom"
           href="/media/{{ item.image_path }}"
           target="_blank"
           rel="noopener"
           aria-label="Zoom image for {{ item.name }}">
          <img src="/media/{{ item.image_path }}"
               alt="{{ item.name }}"
               width="36"
               height="36">
        </a>
        <label class="inventory-image-change"
               for="inventory-image-{{ item.id }}">
          Change
        </label>
      {% else %}
        <label class="inventory-image-placeholder"
               for="inventory-image-{{ item.id }}"
               aria-label="Add image for {{ item.name }}">
          <span class="plus-icon">+</span>
        </label>
      {% endif %}

      <input id="inventory-image-{{ item.id }}"
             type="file"
             name="file"
             accept="image/*"
             hx-post="/inventory/{{ item.id }}/image"
             hx-trigger="change"
             hx-encoding="multipart/form-data"
             hx-target="#inventory-table"
             hx-swap="innerHTML"
             hx-include="[name='include_notion']"
             hidden>
    </div>
  </td>

  <td class="inventory-cell">
    <span class="inventory-pill inventory-pill-barcode">
      {{ item.barcode }}
    </span>
  </td>

  {% include "partials/inventory_name.html" %}

  {% include "partials/inventory_quantity.html" %}

  <td class="inventory-cell inventory-source-cell">
    <span class="source-pill source-{{ item.source }}">
      {{ item.source|capitalize }}
    </span>
  </td>

  <td class="inventory-cell inventory-actions-cell">
    {% if item.source != "notion" %}
      <button class="inventory-delete-btn"
              hx-delete="/inventory/{{ item.id }}"
              hx-target="#inventory-table"
              hx-swap="innerHTML"
              hx-include="[name='include_notion']">
        Delete
      </button>
    {% else %}
      <span class="inventory-readonly inventory-muted inventory-notion-hint">
        Manage in Notion
      </span>
    {% endif %}
  </td>
</tr>
{% endfor %}
