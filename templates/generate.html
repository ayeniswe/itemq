{% block content %}

<div class="generate-page">
  <div class="generate-header">
    <h1>Generate Barcodes</h1>
  </div>

  <div class="generate-grid generate-grid-wide generate-workspace">
    <div class="generate-card generate-selection-panel">
      <div class="generate-selection-heading">
        <h3>Inventory Selection</h3>
        <div class="generate-actions generate-actions-top">
          <button type="button"
                  class="btn-primary"
                  id="generate-labels"
                  hx-post="/generate/create"
                  hx-target="#barcode-preview"
                  hx-swap="innerHTML"
                  hx-include="#barcode-selection">
            Generate labels
          </button>
          <button type="button" class="btn-secondary" id="print-barcodes" disabled>
            Print
          </button>
        </div>
      </div>

      <form id="barcode-selection" class="generate-form barcode-selection-form">
        <div class="barcode-controls-row">
          <label class="barcode-format-field">
            Barcode format
            <select name="format">
              {% for fmt in formats %}
                <option value="{{ fmt.key }}"
                        {% if fmt.key == selected_format %}selected{% endif %}>
                  {{ fmt.label }}
                </option>
              {% endfor %}
            </select>
          </label>
        </div>

        <div id="barcode-inventory-list" class="barcode-list-shell">
          {% include "partials/barcode_inventory_list.html" %}
        </div>
        <div id="barcode-selection-state" hidden></div>

        <div class="barcode-selection-footer">
          <div id="barcode-status-message" class="barcode-status-message" aria-live="polite"></div>
        </div>
      </form>
    </div>

    <div class="generate-card generate-preview-panel">
      <div class="generate-preview-heading">
        <div>
          <h3>Preview</h3>
        </div>
      </div>
      <div id="barcode-preview" class="results-card barcode-preview-shell">
        {% include "partials/barcode_preview.html" %}
      </div>
    </div>
  </div>
</div>

<script>
  const allowedFilterFields = new Set([
    "search",
    "search_case",
    "image_status",
    "group_name",
    "collection_name",
    "collection_category",
    "occasion",
    "season",
    "holiday",
    "emotion",
    "color",
    "event_name",
    "created_from",
    "created_to",
    "tz_offset_minutes",
  ]);

  const selectedItemState = new Map();
  let previewRefreshTimer = null;
  let previewRequestController = null;

  const getTotalItems = () => {
    const totalInput = document.getElementById("barcode-total-items");
    return totalInput ? Number(totalInput.value || "0") : 0;
  };

  const updateSelectAllLabel = () => {
    const selectAllButton = document.getElementById("select-all-items");
    if (!selectAllButton) return;
    const totalItems = getTotalItems();
    const allSelected = totalItems > 0 && selectedItemState.size >= totalItems;
    selectAllButton.textContent = allSelected ? "Clear all" : "Select all";
    selectAllButton.disabled = totalItems === 0;
  };

  const buildFilterParams = (form) => {
    const params = new URLSearchParams();
    allowedFilterFields.forEach((field) => {
      const element = form.elements.namedItem(field);
      if (element instanceof HTMLInputElement || element instanceof HTMLSelectElement) {
        const value = element.value ?? "";
        if (value !== "") {
          params.append(field, value);
        }
      }
    });
    return params;
  };

  const syncHiddenSelectionState = () => {
    const stateContainer = document.getElementById("barcode-selection-state");
    if (!stateContainer) return;
    stateContainer.innerHTML = "";
    Array.from(selectedItemState.entries())
      .sort((left, right) => Number(left[0]) - Number(right[0]))
      .forEach(([itemId, state]) => {
        const itemInput = document.createElement("input");
        itemInput.type = "hidden";
        itemInput.name = "item_ids";
        itemInput.value = String(itemId);
        stateContainer.appendChild(itemInput);

        const quantityInput = document.createElement("input");
        quantityInput.type = "hidden";
        quantityInput.name = `quantity_${itemId}`;
        quantityInput.value = String(Math.max(Number(state.quantity || 0), 0));
        stateContainer.appendChild(quantityInput);
      });
  };

  const cacheSelectionFromVisibleRows = () => {
    const rows = Array.from(document.querySelectorAll(".barcode-inventory-row"));
    rows.forEach((row) => {
      const checkbox = row.querySelector(".barcode-item-checkbox");
      const quantityInput = row.querySelector(".barcode-quantity input");
      if (!(checkbox instanceof HTMLInputElement) || !(quantityInput instanceof HTMLInputElement)) {
        return;
      }
      const quantity = Math.max(Number(quantityInput.value || "0"), 0);
      if (checkbox.checked) {
        selectedItemState.set(checkbox.value, {
          quantity,
          hasLabel: checkbox.dataset.hasLabel === "true",
        });
      } else {
        selectedItemState.delete(checkbox.value);
      }
    });
    syncHiddenSelectionState();
  };

  const applySelectionToVisibleRows = (root = document) => {
    const rows = Array.from(root.querySelectorAll(".barcode-inventory-row"));
    rows.forEach((row) => {
      const checkbox = row.querySelector(".barcode-item-checkbox");
      const quantityInput = row.querySelector(".barcode-quantity input");
      if (!(checkbox instanceof HTMLInputElement) || !(quantityInput instanceof HTMLInputElement)) {
        return;
      }
      const selectedState = selectedItemState.get(checkbox.value);
      checkbox.checked = Boolean(selectedState);
      if (selectedState) {
        quantityInput.value = String(selectedState.quantity);
      }
    });
  };

  const preloadBarcodeImages = () => {
    const images = Array.from(document.querySelectorAll("#barcode-preview img"));
    if (!images.length) {
      return Promise.resolve();
    }
    return Promise.all(images.map((image) => {
      image.loading = "eager";
      if (image.complete && image.naturalWidth > 0) {
        return Promise.resolve();
      }
      return new Promise((resolve) => {
        image.addEventListener("load", resolve, { once: true });
        image.addEventListener("error", resolve, { once: true });
      });
    }));
  };

  const getSelection = () => {
    const selected = Array.from(selectedItemState.entries()).map(([itemId, state]) => ({
      value: itemId,
      hasLabel: state.hasLabel,
      quantity: state.quantity,
    }));
    const missing = selected.filter((item) => !item.hasLabel);
    return { selected, missing };
  };

  const closeBarcodeFilterDrawer = () => {
    document.querySelectorAll(".barcode-filter-dialog[open]").forEach((dialog) => {
      dialog.close();
    });
    const trigger = document.getElementById("barcode-filter-trigger");
    if (trigger) {
      trigger.setAttribute("aria-expanded", "false");
    }
  };

  const openBarcodeFilterDrawer = () => {
    const dialog = document.getElementById("barcode-filter-dialog");
    const trigger = document.getElementById("barcode-filter-trigger");
    if (!(dialog instanceof HTMLDialogElement)) return;
    if (!dialog.open) {
      dialog.showModal();
    }
    if (trigger) {
      trigger.setAttribute("aria-expanded", "true");
    }
  };

  const refreshPreview = async () => {
    const form = document.getElementById("barcode-selection");
    const preview = document.getElementById("barcode-preview");
    if (!(form instanceof HTMLFormElement) || !(preview instanceof HTMLElement)) return;

    cacheSelectionFromVisibleRows();
    if (previewRequestController) {
      previewRequestController.abort();
    }
    const controller = new AbortController();
    previewRequestController = controller;

    try {
      const response = await fetch("/generate/preview", {
        method: "POST",
        body: new FormData(form),
        signal: controller.signal,
      });
      if (!response.ok) return;
      preview.innerHTML = await response.text();
      await preloadBarcodeImages();
    } catch (error) {
      if (error?.name !== "AbortError") {
        console.error(error);
      }
    } finally {
      if (previewRequestController === controller) {
        previewRequestController = null;
      }
    }
  };

  const queuePreviewRefresh = (delay = 120) => {
    window.clearTimeout(previewRefreshTimer);
    previewRefreshTimer = window.setTimeout(() => {
      refreshPreview();
    }, delay);
  };

  const selectAllAcrossPages = async () => {
    const form = document.getElementById("barcode-selection");
    const selectAllButton = document.getElementById("select-all-items");
    if (!form) return;
    const params = buildFilterParams(form);
    if (selectAllButton) {
      selectAllButton.disabled = true;
      selectAllButton.textContent = "Selecting...";
    }
    try {
      const response = await fetch(`/generate/selection_state?${params.toString()}`);
      if (!response.ok) return;
      const payload = await response.json();
      const items = payload.items || [];
      const total = Number(payload.total || items.length || 0);
      selectedItemState.clear();
      items.forEach((item) => {
        const quantity = Math.max(Number(item.quantity || 0), 1);
        selectedItemState.set(String(item.id), {
          quantity,
          hasLabel: Boolean(item.has_label),
        });
      });
      const totalInput = document.getElementById("barcode-total-items");
      if (totalInput) {
        totalInput.value = String(total);
      }
      applySelectionToVisibleRows();
      syncHiddenSelectionState();
      updateActionState();
      queuePreviewRefresh(0);
    } finally {
      if (selectAllButton) {
        selectAllButton.disabled = false;
      }
      updateSelectAllLabel();
    }
  };

  const handlePrint = async () => {
    const form = document.getElementById("barcode-selection");
    const preview = document.getElementById("barcode-preview");
    const statusMessage = document.getElementById("barcode-status-message");
    const printButton = document.getElementById("print-barcodes");
    if (!form || !preview) return;
    const { selected, missing } = getSelection();
    if (!selected.length) {
      if (statusMessage) {
        statusMessage.innerHTML = "<div class=\"barcode-warning\">Select items to print.</div>";
      }
      return;
    }
    const zeroQuantity = selected.some((item) => Number(item.quantity || 0) <= 0);
    if (zeroQuantity) {
      if (statusMessage) {
        statusMessage.innerHTML = "<div class=\"barcode-warning\">Set quantities above zero before printing.</div>";
      }
      return;
    }
    if (missing.length) {
      if (statusMessage) {
        statusMessage.innerHTML = "<div class=\"barcode-warning\">Some selections do not have labels yet. Generate labels first.</div>";
      }
      return;
    }
    if (statusMessage) {
      statusMessage.innerHTML = "<div class=\"barcode-warning\">Creating PDF sheet...</div>";
    }
    if (printButton) {
      printButton.disabled = true;
    }
    try {
      const response = await fetch("/generate/print", {
        method: "POST",
        body: new FormData(form),
      });
      if (!response.ok) {
        const html = await response.text();
        if (statusMessage) {
          statusMessage.innerHTML = html;
        }
        return;
      }
      const pdfBlob = await response.blob();
      const pdfUrl = URL.createObjectURL(pdfBlob);
      const printWindow = window.open(pdfUrl, "_blank");
      if (printWindow) {
        printWindow.addEventListener(
          "load",
          () => {
            printWindow.focus();
            printWindow.print();
          },
          { once: true }
        );
        printWindow.addEventListener(
          "afterprint",
          () => {
            URL.revokeObjectURL(pdfUrl);
          },
          { once: true }
        );
        setTimeout(() => {
          URL.revokeObjectURL(pdfUrl);
        }, 60000);
      } else {
        const link = document.createElement("a");
        link.href = pdfUrl;
        link.download = "barcode-labels.pdf";
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => {
          URL.revokeObjectURL(pdfUrl);
        }, 60000);
      }
      if (statusMessage) {
        statusMessage.innerHTML = "";
      }
    } finally {
      if (printButton) {
        printButton.disabled = false;
      }
    }
  };

  const updateActionState = () => {
    const printButton = document.getElementById("print-barcodes");
    const generateButton = document.getElementById("generate-labels");
    const statusMessage = document.getElementById("barcode-status-message");
    if (!printButton || !generateButton) return;
    const { selected, missing } = getSelection();
    const hasSelection = selected.length > 0;
    const hasZeroQuantity = selected.some((item) => Number(item.quantity || 0) <= 0);
    generateButton.disabled = !hasSelection;
    printButton.disabled = !hasSelection;
    if (!hasSelection && statusMessage) {
      statusMessage.innerHTML = "";
    } else if (hasSelection && hasZeroQuantity && statusMessage) {
      statusMessage.innerHTML =
        "<div class=\"barcode-warning\">Set quantities above zero before generating or printing.</div>";
      generateButton.disabled = true;
      printButton.disabled = true;
    } else if (hasSelection && missing.length && statusMessage) {
      statusMessage.innerHTML =
        "<div class=\"barcode-warning\">Some selections do not have labels yet. Generate labels to enable printing.</div>";
    } else if (statusMessage) {
      statusMessage.innerHTML = "";
    }
  };

  const setupPrintButton = () => {
    const printButton = document.getElementById("print-barcodes");
    if (!printButton || printButton.dataset.bound === "true") return;
    printButton.dataset.bound = "true";
    printButton.addEventListener("click", handlePrint);
  };

  const setBarcodeTzOffset = (root = document) => {
    const tzInput = root.getElementById ? root.getElementById("barcode-tz-offset") : root.querySelector("#barcode-tz-offset");
    if (tzInput) {
      tzInput.value = String(new Date().getTimezoneOffset());
    }
  };

  document.addEventListener("DOMContentLoaded", () => {
    setBarcodeTzOffset();
    cacheSelectionFromVisibleRows();
    applySelectionToVisibleRows();
    updateSelectAllLabel();
    updateActionState();
    setupPrintButton();
  });

  document.addEventListener("click", async (event) => {
    const target = event.target;
    if (!(target instanceof HTMLElement)) return;
    if (target.closest("#barcode-filter-trigger")) {
      openBarcodeFilterDrawer();
      return;
    }
    if (target.closest("#barcode-filter-close")) {
      closeBarcodeFilterDrawer();
      return;
    }
    if (!target.closest(".barcode-filter-dialog")) {
      closeBarcodeFilterDrawer();
    }
    if (target.id !== "select-all-items") return;
    event.preventDefault();
    const totalItems = getTotalItems();
    const allSelected = totalItems > 0 && selectedItemState.size >= totalItems;
    if (allSelected) {
      selectedItemState.clear();
      document.querySelectorAll(".barcode-item-checkbox").forEach((checkbox) => {
        checkbox.checked = false;
      });
      document.querySelectorAll(".barcode-quantity input").forEach((input) => {
        input.value = "0";
      });
      syncHiddenSelectionState();
      updateActionState();
      updateSelectAllLabel();
      queuePreviewRefresh(0);
      return;
    }
    await selectAllAcrossPages();
  });

  document.body.addEventListener("htmx:beforeRequest", (event) => {
    const target = event.target;
    if (!(target instanceof HTMLElement)) return;
    if (target.id === "generate-labels") {
      cacheSelectionFromVisibleRows();
      return;
    }
    if (target.closest(".barcode-filters")) {
      selectedItemState.clear();
      syncHiddenSelectionState();
      updateActionState();
      updateSelectAllLabel();
      queuePreviewRefresh(0);
    }
  });

  document.body.addEventListener("htmx:afterSwap", (event) => {
    const target = event.target;
    if (!(target instanceof HTMLElement)) return;
    if (target.id === "barcode-inventory-list") {
      const searchInput = document.getElementById("barcode-inventory-search");
      if (searchInput instanceof HTMLElement) {
        searchInput.focus({ preventScroll: true });
      }
      applySelectionToVisibleRows(target);
      setBarcodeTzOffset(target);
      queuePreviewRefresh(0);
    }
    const totalInput = target.querySelector ? target.querySelector("#barcode-total-items") : null;
    if (totalInput instanceof HTMLInputElement) {
      totalInput.value = totalInput.value || "0";
    }
    syncHiddenSelectionState();
    updateSelectAllLabel();
    updateActionState();
    setupPrintButton();
  });

  document.addEventListener("change", (event) => {
    const target = event.target;
    if (!(target instanceof HTMLElement)) return;
    if (target.classList.contains("barcode-item-checkbox")) {
      if (target instanceof HTMLInputElement && target.checked) {
        const row = target.closest(".barcode-inventory-row");
        const quantityInput = row?.querySelector(".barcode-quantity input");
        if (quantityInput instanceof HTMLInputElement && Number(quantityInput.value || "0") <= 0) {
          quantityInput.value = "1";
        }
      }
      cacheSelectionFromVisibleRows();
      updateActionState();
      updateSelectAllLabel();
      queuePreviewRefresh();
      return;
    }
    if (target.closest(".barcode-quantity")) {
      cacheSelectionFromVisibleRows();
      updateActionState();
      queuePreviewRefresh();
      return;
    }
    if (target.id === "select-all-items") {
      cacheSelectionFromVisibleRows();
      queuePreviewRefresh();
      return;
    }
    if (target.getAttribute("name") === "format") {
      queuePreviewRefresh();
    }
  });

  document.addEventListener("input", (event) => {
    const target = event.target;
    if (!(target instanceof HTMLElement)) return;
    if (!target.closest(".barcode-quantity")) return;
    cacheSelectionFromVisibleRows();
    updateActionState();
    queuePreviewRefresh();
  });

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") {
      closeBarcodeFilterDrawer();
    }
  });

  document.addEventListener("close", (event) => {
    const target = event.target;
    if (target instanceof HTMLDialogElement && target.id === "barcode-filter-dialog") {
      const trigger = document.getElementById("barcode-filter-trigger");
      if (trigger) {
        trigger.setAttribute("aria-expanded", "false");
      }
    }
  }, true);

  document.addEventListener(
    "wheel",
    (event) => {
      const target = event.target;
      if (!(target instanceof HTMLElement)) return;
      if (!target.closest(".barcode-quantity")) return;
      event.preventDefault();
      if (target instanceof HTMLInputElement) {
        target.blur();
      }
    },
    { passive: false }
  );

  const markSelectionAsGenerated = () => {
    selectedItemState.forEach((state, key) => {
      selectedItemState.set(key, {
        ...state,
        hasLabel: true,
        quantity: Math.max(Number(state.quantity || 0), 1),
      });
    });
  };

  document.body.addEventListener("htmx:afterRequest", (event) => {
    const path = event.detail?.pathInfo?.requestPath;
    const status = event.detail?.xhr?.status;
    if (path === "/generate/create" && status && status < 400) {
      markSelectionAsGenerated();
      syncHiddenSelectionState();
      updateActionState();
      updateSelectAllLabel();
      preloadBarcodeImages();
    }
  });
</script>

{% endblock %}
